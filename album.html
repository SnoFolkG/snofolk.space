  <body>
    <header>
      <a class="site-title">
        <h1>SnoFolk.Space</h1>
      </a>
      <nav>
        <a href="index.html">
          <img class="nav-icon" src="../img/icons/home.png" alt="" aria-hidden="true" />
          <span class="nav-label">Homepage</span>
        </a>
        <a href="downloads.html" class="active">
          <img class="nav-icon" src="../img/icons/down.png" alt="" aria-hidden="true" />
          <span class="nav-label"><strong>Downloads</strong></span>
        </a>
        <a href="news.html">
          <img class="nav-icon" src="../img/icons/news.png" alt="" aria-hidden="true" />
          <span class="nav-label">News</span>
        </a>
        <a href="info.html">
          <img class="nav-icon" src="../img/icons/info.png" alt="" aria-hidden="true" />
          <span class="nav-label">Info</span>
        </a>
      </nav>
    </header>

    <main class="album-detail-page">
      <!-- COVER, DOWNLOAD BUTTON, SIMILAR ALBUMS -->
      <section class="album-links-side">
        <img class="album-page-cover" src="../img/*.jpg" alt="*" />

        <a class="download-btn download-cover-btn" href="" target="_blank">Download Album (.zip)</a>

        <section class="similar-albums">
          <h3>Similar Albums</h3>
          <div class="similar-albums-grid">
            <div class="similar-album-card">
              <a href="*.html">
                <img src="../img/*.jpg" alt="*" />
                <p><strong>*</strong><br />*</p></a
              >
            </div>
          </div>
        </section>
      </section>

      <!-- INFO, META, TRACKLIST -->
      <section class="album-info-side">
        <h2 class="album-title">*</h2>
        <p class="album-artist">*</p>

        <ul class="album-meta">
          <li><span>Year</span>*</li>
          <li><span>Genre</span>*</li>
          <li><span>City</span>*</li>
          <li><span>County</span>*</li>
          <li><span>Label</span>*</li>
          <li><span>Bitrate</span>*</li>
        </ul>

        <section class="tracklist">
          <h3>Tracklist</h3>
          <ol>
            <li><span class="track-name">*</span> <span class="track-duration">*</span></li>
          </ol>
        </section>
      </section>
    </main>

    <footer>Stay punk, stay core. Made by SnoFolk. Site version: 6.0.0</footer>
